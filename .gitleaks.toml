title = "Plataforma Fenix - Gitleaks"

[extend]
useDefault = true

[[rules]]
id = "gcp-api-key"

[[rules.allowlists]]
description = "Firebase Android client API key in generated google-services.json"
condition = "AND"
regexTarget = "line"
paths = ['^\Qandroid/app/google-services.json\E$']
regexes = ['"current_key"\s*:\s*"AIza[0-9A-Za-z_-]{35}"']
