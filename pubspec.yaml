name: geduc_rae_mobile
description: App GEDUC/RAE Mobile - Gestão de Ações Educativas de Trânsito
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Compartilhamento e arquivos
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Estado e navegação
  provider: ^6.1.2
  go_router: ^14.0.0

  # Localização
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Mapa aberto — OpenStreetMap
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Fotos
  image_picker: ^1.1.2

  # Permissões
  permission_handler: ^11.3.1

  # Conectividade
  connectivity_plus: ^6.0.3

  # Armazenamento local
  shared_preferences: ^2.2.3

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0

  # Relatórios PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Dashboard
  fl_chart: ^0.68.0

  # QR Code
  qr_flutter: ^4.1.0
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/header_timbrado.png
    - assets/images/footer_timbrado.png
    - assets/images/faixita_login.png
    - assets/images/login_beira_mar.webp